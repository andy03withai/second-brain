<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
      padding: 40px;
    }
    
    .card {
      width: 1080px;
      background: white;
      border-radius: 24px;
      padding: 80px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    
    .header {
      margin-bottom: 48px;
    }
    
    .date {
      font-size: 18px;
      color: #999;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .title {
      font-size: 56px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
      margin-bottom: 24px;
    }
    
    .summary {
      font-size: 28px;
      color: #666;
      line-height: 1.6;
      padding-left: 24px;
      border-left: 4px solid #4a90d9;
    }
    
    .points {
      margin-top: 48px;
    }
    
    .points h3 {
      font-size: 24px;
      color: #999;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .points ul {
      list-style: none;
    }
    
    .points li {
      font-size: 26px;
      color: #333;
      line-height: 1.8;
      margin-bottom: 16px;
      padding-left: 40px;
      position: relative;
    }
    
    .points li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: #4a90d9;
      font-weight: bold;
    }
    
    .footer {
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid #eee;
      font-size: 18px;
      color: #999;
    }
    
    .footer a {
      color: #4a90d9;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="date">20260309</div>
      <h1 class="title">来自 xiaoyuzhoufm.com</h1>
      <p class="summary">就像核心摘要...</p>
    </div>
    
    <div class="points">
      <h3>核心要点</h3>
      <ul>
      <li>[ ] 你提到 'https://www.xiaoyuzhoufm.com/episode/69aaa17d5b2d0ed0699d6cf6'——顺着这个思路还能想到什么？</li>
      <li>[ ] '相关链接' 让你联想到什么个人经验或已知知识？</li>
      <li>[ ] 如果质疑 '相关链接'，你会从哪里切入？</li>
      <li>[ ] 这篇文章的结论边界在哪里？在什么情况下不适用？</li>
      </ul>
    </div>
    
    <div class="footer">
      收藏于 第二大脑 · https://www.xiaoyuzhoufm.com/episode/69aaa17d5b2d0...
    </div>
  </div>
</body>
</html>
